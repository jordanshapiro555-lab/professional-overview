<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Strategic audit preview</title>
  <desc id="desc">A strategic audit slide preview showing progressive discovery, evidence cards, a query mapping chart, data table, and pathfinder examples.</desc>
