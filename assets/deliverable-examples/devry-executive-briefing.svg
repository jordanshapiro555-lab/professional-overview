<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Executive briefing preview</title>
  <desc id="desc">An executive briefing slide preview showing outcome based pathing, a concept card, and control versus experiment mockups.</desc>
  <rect width="1600" height="900" fill="#ffffff"/>
  <rect width="1600" height="120" fill="#24329b"/>
  <polygon points="1330,0 1600,0 1515,120" fill="#4368f5" opacity="0.95"/>
  <polygon points="1600,28 1600,120 1515,120" fill="#344bd5" opacity="0.9"/>
  <text x="70" y="76" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="900">Outcome-Based Pathing</text>
  <rect x="0" y="120" width="150" height="50" rx="0" fill="#3864f4"/>
  <text x="75" y="141" text-anchor="middle" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800">Information</text>
  <text x="75" y="158" text-anchor="middle" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800">Hierarchy</text>
  <g transform="translate(30 282)">
    <rect width="440" height="550" rx="18" fill="#223a8a"/>
    <text x="220" y="58" text-anchor="middle" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="900">Concept</text>
    <text x="18" y="104" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="800">Primary focus:</text>
    <text x="18" y="128" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="18">- Re-frame the path selection conversation</text>
    <text x="40" y="152" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="18">around outcomes rather than degrees to</text>
    <text x="40" y="176" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="18">simplify decisions</text>
    <text x="18" y="224" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="800">Rationale:</text>
    <text x="18" y="248" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="18">- This is in place on Coursera (Link)</text>
    <text x="18" y="272" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="18">- Career-first progression matches how</text>
    <text x="40" y="296" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="18">prospects think about education decisions by</text>
    <text x="40" y="320" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="18">starting with an outcome and removing the</text>
    <text x="40" y="344" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="18">complexity around which degree pairs with</text>
    <text x="40" y="368" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="18">desired outcome</text>
    <text x="18" y="416" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="800">Follow-ups:</text>
    <text x="18" y="440" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="18">- Average salaries and field growth</text>
    <text x="18" y="464" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="18">- Comparison feature with multi-select</text>
    <text x="18" y="488" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="18">- Embedded recommended path quiz</text>
  </g>
  <text x="640" y="290" text-anchor="middle" fill="#000" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800">Control</text>
  <line x1="560" y1="302" x2="1080" y2="302" stroke="#24329b" stroke-width="5" stroke-linecap="round"/>
  <g transform="translate(560 322)">
    <rect width="504" height="116" fill="#fff" stroke="#aaa"/>
    <text x="58" y="20" fill="#15359c" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="800">Boost your marketability with industry</text>
    <text x="58" y="34" fill="#15359c" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="800">certification prep</text>
    <text x="260" y="20" fill="#15359c" font-family="Inter, Arial, sans-serif" font-size="6" font-weight="800">With built-in exam prep, our programs can help you prepare for the following</text>
    <line x1="260" y1="42" x2="420" y2="42" stroke="#24329b"/><line x1="260" y1="56" x2="420" y2="56" stroke="#24329b"/><line x1="260" y1="70" x2="420" y2="70" stroke="#24329b"/>
    <rect y="100" width="504" height="16" fill="#eeeae6"/>
  </g>
  <text x="1150" y="290" text-anchor="middle" fill="#000" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800">Experiment</text>
  <line x1="1115" y1="302" x2="1562" y2="302" stroke="#24329b" stroke-width="5" stroke-linecap="round"/>
  <g transform="translate(1116 322)">
    <rect width="446" height="386" fill="#fff" stroke="#999"/>
    <text x="50" y="18" fill="#15359c" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="800">Boost your marketability with industry</text>
    <text x="50" y="32" fill="#15359c" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="800">certification prep</text>
    <rect y="86" width="446" height="56" fill="#f0eee9"/>
    <text x="223" y="122" text-anchor="middle" fill="#15359c" font-family="Inter, Arial, sans-serif" font-size="13">Find your dream job</text>
    <rect x="20" y="152" width="254" height="24" rx="5" fill="#fff" stroke="#d4dce8"/>
    <rect x="20" y="190" width="116" height="56" rx="6" fill="#fff7e2" stroke="#2f68f5"/><rect x="154" y="190" width="116" height="56" rx="6" fill="#fff" stroke="#d4dce8"/>
    <rect x="20" y="256" width="116" height="56" rx="6" fill="#fff" stroke="#d4dce8"/><rect x="154" y="256" width="116" height="56" rx="6" fill="#fff" stroke="#d4dce8"/>
    <rect x="286" y="176" width="142" height="166" rx="6" fill="#f4f7fb" stroke="#d4dce8"/>
    <text x="300" y="198" fill="#15359c" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="800">Selected role: Business Analyst</text>
    <rect x="302" y="290" width="110" height="28" rx="4" fill="#2f68f5"/>
    <text x="357" y="309" text-anchor="middle" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="800">See matching program</text>
  </g>
  <g transform="translate(1026 590)">
    <rect width="126" height="260" rx="8" fill="#fff" stroke="#c4ccd8"/>
    <rect x="14" y="30" width="98" height="22" rx="5" fill="#fff" stroke="#d4dce8"/>
    <rect x="14" y="66" width="98" height="50" rx="6" fill="#fff7e2" stroke="#2f68f5"/>
    <rect x="14" y="124" width="98" height="50" rx="6" fill="#fff" stroke="#d4dce8"/>
    <rect x="14" y="182" width="98" height="50" rx="6" fill="#fff" stroke="#d4dce8"/>
  </g>
  <text x="1532" y="870" text-anchor="end" fill="#aaa" font-family="Inter, Arial, sans-serif" font-size="12">HORIZON MEDIA | DEVRY | 23</text>
</svg>
