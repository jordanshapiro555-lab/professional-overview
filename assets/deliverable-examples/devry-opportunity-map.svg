    <text x="169" y="430" text-anchor="middle" fill="#2f68f5" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="900">DISCOVERY</text>
    <text x="169" y="500" text-anchor="middle" fill="#111" font-family="Inter, Arial, sans-serif" font-size="24">Enabling user discovery all</text>
    <text x="169" y="530" text-anchor="middle" fill="#111" font-family="Inter, Arial, sans-serif" font-size="24">the way to their exact</text>
    <text x="169" y="560" text-anchor="middle" fill="#111" font-family="Inter, Arial, sans-serif" font-size="24">program of interest avoids</text>
    <text x="169" y="590" text-anchor="middle" fill="#111" font-family="Inter, Arial, sans-serif" font-size="24">halting exploration and</text>
    <text x="169" y="620" text-anchor="middle" fill="#111" font-family="Inter, Arial, sans-serif" font-size="24">produces high quality leads</text>
