    <text x="169" y="462" text-anchor="middle" fill="#111" font-family="Inter, Arial, sans-serif" font-size="24">Guided pathfinders reduce</text>
    <text x="169" y="492" text-anchor="middle" fill="#111" font-family="Inter, Arial, sans-serif" font-size="24">decision burden for</text>
    <text x="169" y="522" text-anchor="middle" fill="#111" font-family="Inter, Arial, sans-serif" font-size="24">undecided users, especially</text>
    <text x="169" y="552" text-anchor="middle" fill="#111" font-family="Inter, Arial, sans-serif" font-size="24">when decisions are put into</text>
    <text x="169" y="582" text-anchor="middle" fill="#111" font-family="Inter, Arial, sans-serif" font-size="24">user terms like role-based</text>
    <text x="169" y="612" text-anchor="middle" fill="#111" font-family="Inter, Arial, sans-serif" font-size="24">discovery</text>
