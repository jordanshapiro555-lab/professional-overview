<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Opportunity map preview</title>
  <desc id="desc">An opportunity map slide preview showing three progressive discovery cards for pathing, specific program discovery, and guided user paths.</desc>
