    <text x="169" y="462" text-anchor="middle" fill="#111" font-family="Inter, Arial, sans-serif" font-size="24">Improved content discovery</text>
    <text x="169" y="492" text-anchor="middle" fill="#111" font-family="Inter, Arial, sans-serif" font-size="24">enables users to progress</text>
    <text x="169" y="522" text-anchor="middle" fill="#111" font-family="Inter, Arial, sans-serif" font-size="24">from high-level interests to</text>
    <text x="169" y="552" text-anchor="middle" fill="#111" font-family="Inter, Arial, sans-serif" font-size="24">targeted programs, reducing</text>
