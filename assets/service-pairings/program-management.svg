<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Program management photo-style workspace</title>
  <desc id="desc">A hyper-realistic styled experimentation operations room with planning boards, dashboards, and program management activity.</desc>
  <defs>
    <linearGradient id="room" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f9fafb"/><stop offset="0.45" stop-color="#ecf3ff"/><stop offset="1" stop-color="#d7e4f4"/></linearGradient>
    <linearGradient id="screen" x1="0" x2="1"><stop offset="0" stop-color="#111827"/><stop offset="1" stop-color="#223a8a"/></linearGradient>
    <radialGradient id="warmSkin" cx="45%" cy="28%" r="70%"><stop offset="0" stop-color="#ffd8bf"/><stop offset="0.75" stop-color="#c18462"/><stop offset="1" stop-color="#744832"/></radialGradient>
    <radialGradient id="coolSkin" cx="50%" cy="28%" r="72%"><stop offset="0" stop-color="#f7c9ac"/><stop offset="0.72" stop-color="#a86f4f"/><stop offset="1" stop-color="#65432e"/></radialGradient>
    <filter id="photoShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="24" stdDeviation="18" flood-color="#101a34" flood-opacity="0.2"/></filter>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="16"/></filter>
  </defs>
  <rect width="1200" height="760" fill="url(#room)"/>
  <circle cx="1060" cy="92" r="150" fill="#ffffff" opacity="0.55" filter="url(#blur)"/>
