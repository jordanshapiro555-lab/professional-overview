    <rect x="72" y="76" width="1056" height="428" rx="34" fill="url(#screen)"/>
    <rect x="120" y="126" width="286" height="292" rx="18" fill="#ffffff" opacity="0.97"/>
    <rect x="456" y="126" width="286" height="292" rx="18" fill="#ffffff" opacity="0.97"/>
    <rect x="792" y="126" width="286" height="292" rx="18" fill="#ffffff" opacity="0.97"/>
    <rect x="152" y="164" width="178" height="18" rx="9" fill="#2563eb"/><rect x="152" y="224" width="210" height="62" rx="14" fill="#eaf1ff"/><rect x="152" y="314" width="156" height="62" rx="14" fill="#eaf1ff"/>
    <rect x="488" y="164" width="178" height="18" rx="9" fill="#2563eb"/><rect x="488" y="224" width="210" height="62" rx="14" fill="#eaf1ff"/><rect x="488" y="314" width="156" height="62" rx="14" fill="#eaf1ff"/>
    <rect x="824" y="164" width="166" height="18" rx="9" fill="#2563eb"/><rect x="824" y="224" width="196" height="62" rx="14" fill="#eaf1ff"/><rect x="824" y="314" width="146" height="62" rx="14" fill="#eaf1ff"/>
