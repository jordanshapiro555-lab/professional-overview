<!DOCTYPE html>
  <html>
  <body>
<div class="formContainer">
    <div class="homeContactFormCard">
      <h3 class="homeContactFormTitle">Contact me for a 1 on 1 Consultation</h3>

      <form class="homeContactFormForm" action="mailto:jordanshapiro555@gmail.com" method="post">
        <div class="homeContactFormGrid">
          <div class="homeContactFormField">
            <label class="homeContactFormLabel" for="homeContactFormName">Full Name</label>
            <input class="homeContactFormInput" id="homeContactFormName" name="name" type="text" autocomplete="name" placeholder="Peter Pan" />
          </div>

          <div class="homeContactFormField">
            <label class="homeContactFormLabel" for="homeContactFormPhone">Phone Number</label>
            <input class="homeContactFormInput" id="homeContactFormPhone" name="phone" type="tel" placeholder="123-456-7899" autocomplete="tel" />
          </div>

          <div class="homeContactFormField">
            <label class="homeContactFormLabel" for="homeContactFormEmail">Your Email</label>
            <input class="homeContactFormInput" id="homeContactFormEmail" name="email" type="email" placeholder="email@example.com" autocomplete="email" />
          </div>

          <div class="homeContactFormField homeContactFormFieldWide">
            <label class="homeContactFormLabel" for="homeContactFormMessage">Tell me more</label>
            <input class="homeContactFormInput" id="homeContactFormMessage" name="message" type="text" />
          </div>

          <button class="homeContactFormButton" type="submit">Reach out</button>
        </div>
      </form>
    </div>
  </div>
  </body
  </html>
