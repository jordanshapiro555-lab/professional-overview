name: CRO Blog Pipeline
on:
  schedule:
    - cron: '0 14 1,15 * *'
  workflow_dispatch:
    inputs:
      topic_seed:
        description: 'Optional topic hint (leave blank for fully autonomous)'
        required: false
        default: ''

jobs:
  generate-blog:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Chrome for Lighthouse
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
      - name: Install dependencies
        run: npm install @anthropic-ai/claude-agent-sdk resend replicate
      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TOPIC_SEED: ${{ inputs.topic_seed }}
        run: node scripts/pipeline.mjs
