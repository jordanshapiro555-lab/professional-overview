name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - codex/fix-anthropic-chatbot
    paths:
      - src/**
      - wrangler.jsonc
      - .github/workflows/deploy-cloudflare-worker.yml
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: 50de46dbcd1e23f3a373979cb72209f0
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Check Cloudflare token secret
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing GitHub Actions secret CLOUDFLARE_API_TOKEN. Add it at Settings > Secrets and variables > Actions > Repository secrets."
            exit 1
          fi

      - name: Show Wrangler version
        run: npx --yes wrangler@latest --version

      - name: Deploy Worker
        run: npx --yes wrangler@latest deploy --keep-vars

      - name: Verify live chatbot formatting
        run: |
          node <<'NODE'
          const endpoint = 'https://cro-consulting.jordanshapiro555.workers.dev/api/chat';
          const res = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              message: 'Give me a short list of what Jordan can do for my business, and include how to contact him.',
              history: []
            })
          });
          const bodyText = await res.text();
          let body;
          try {
            body = JSON.parse(bodyText);
          } catch {
            throw new Error(`Chatbot returned non-JSON response: ${bodyText.slice(0, 500)}`);
          }
          const reply = String(body.reply || '');
          console.log(`Chat status: ${res.status}`);
          console.log(`Reply characters: ${reply.length}`);
          console.log(`Reply preview: ${reply.slice(0, 220)}`);
          if (!res.ok || !reply) {
            throw new Error(`Expected a successful nonempty reply, got ${res.status}: ${bodyText.slice(0, 500)}`);
          }
          if (reply.length > 400) {
            throw new Error(`Reply exceeded 400 characters: ${reply.length}`);
          }
          if (reply.includes('**')) {
            throw new Error('Reply still contains double-asterisk markdown.');
          }
          if (/\[[^\]]+\]\([^)]+\)/.test(reply)) {
            throw new Error('Reply still contains markdown link syntax.');
          }
          NODE
