name: Patch winners grid

on:
  push:
    branches:
      - agent/add-brooks-brothers-winners

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, 'Run winners grid patch')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-brooks-brothers-winners
      - name: Patch winners grid HTML
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('work/test-winners/index.html')
          s = path.read_text(encoding='utf-8')
          s = s.replace('<label class="filter-chip"><input type="checkbox" value="ctr"> CTR</label>\n                        <label class="filter-chip"><input type="checkbox" value="cart-adds"> Cart Adds</label>', '<label class="filter-chip"><input type="checkbox" value="ctr"> CTR</label>\n            <label class="filter-chip"><input type="checkbox" value="rpv"> RPV</label>\n                        <label class="filter-chip"><input type="checkbox" value="cart-adds"> Cart Adds</label>', 1)
          s = s.replace('<label class="filter-chip"><input type="checkbox" value="ctr"> CTR</label>\n                <label class="filter-chip"><input type="checkbox" value="cart-adds"> Cart Adds</label>', '<label class="filter-chip"><input type="checkbox" value="ctr"> CTR</label>\n        <label class="filter-chip"><input type="checkbox" value="rpv"> RPV</label>\n                <label class="filter-chip"><input type="checkbox" value="cart-adds"> Cart Adds</label>', 1)
          s = s.replace("ctr: 'CTR', 'cart-adds': 'Cart Adds',", "ctr: 'CTR', rpv: 'RPV', 'cart-adds': 'Cart Adds',")
          cards = '''

      <article class="blog-grid-card" data-label-brand="Brooks Brothers" data-label-page="Home" data-label-lift=0 data-industry="retail" data-section="home" data-device="all" data-kpi="rpv" data-start-date="2026-07-15" data-metric-text="RPV Winner" data-order="19">
        <a href="https://jordanshapiro555-lab.github.io/CRO-Consulting/work/test-winners/bb-saved-bag-home-callout" class="blog-grid-link">
          <div class="blog-grid-media">
            <img src="../../assets/winners/BB_Saved_Back_Callout_Hero.png" alt="Brooks Brothers saved bag homepage callout">
            <span class="metric-badge">RPV Winner</span>
          </div>
          <div class="blog-grid-body">
            <h3 class="blog-grid-heading">Improving RPV With A Saved Bag Homepage Callout</h3>
            <p class="blog-grid-excerpt">Helping direct and returning homepage visitors resume ordering faster made the high-converting home entry point more valuable.</p>
          </div>
        </a>
      </article>

      <article class="blog-grid-card" data-label-brand="Brooks Brothers" data-label-page="PLP" data-label-lift=0 data-industry="retail" data-section="product-listing" data-device="all" data-kpi="ctr" data-start-date="2026-07-15" data-metric-text="CTR Winner" data-order="20">
        <a href="https://jordanshapiro555-lab.github.io/CRO-Consulting/work/test-winners/bb-dress-shirt-filter-reordering" class="blog-grid-link">
          <div class="blog-grid-media">
            <img src="../../assets/winners/BB_Dress_Shirt_Filters_Hero.png" alt="Brooks Brothers dress shirt filter reordering">
            <span class="metric-badge">CTR Winner</span>
          </div>
          <div class="blog-grid-body">
            <h3 class="blog-grid-heading">Improving PLP CTR By Reordering Dress Shirt Filters</h3>
            <p class="blog-grid-excerpt">Raising high-intent filters like Fabric and Collections matched shopper search behavior and encouraged discovery engagement.</p>
          </div>
        </a>
      </article>
'''
          if 'bb-saved-bag-home-callout' not in s:
              s = s.replace('\n    </div>\n  </div>\n</section>\n<div class="buttonContainer">', cards + '\n    </div>\n  </div>\n</section>\n<div class="buttonContainer">', 1)
          path.write_text(s, encoding='utf-8')
          Path('.github/workflows/patch-winners-grid.yml').unlink()
          PY
      - name: Commit grid patch
        run: |
          git config user.name "codex-agent"
          git config user.email "codex-agent@users.noreply.github.com"
          git add work/test-winners/index.html .github/workflows/patch-winners-grid.yml
          git commit -m "Add Brooks Brothers winners to grid"
          git push
