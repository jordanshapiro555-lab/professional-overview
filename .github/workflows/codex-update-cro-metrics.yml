name: Codex Update CRO Metrics

on:
  push:
    branches:
      - codex/update-cro-metrics
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/update-cro-metrics
      - name: Keep UHOne-specific revenue references unchanged
        shell: python
        run: |
          from pathlib import Path
          replacements = {
              "index.html": [
                  ("The best result was 1061% ROI for UHOne's 2024 program ($30M+ in attributed revenue).", "The best result was 1061% ROI for UHOne's 2024 program ($8.7M in attributed revenue)."),
                  ("Strategic product intent capture and checkout experience improvements that drove $30M+ in attributed revenue.", "Strategic product intent capture and checkout experience improvements that drove $8.7M in attributed revenue."),
              ],
              "work/case-studies/uhone-2024.html": [
                  ("$30M+ Revenue Impact", "$8.7M Revenue Impact"),
                  ("$30M+ Revenue", "$8.7M Revenue"),
                  ("$30M+ in attributed revenue", "$8.7M in attributed revenue"),
                  ("$30M+ Incremental Dollars", "$8.7MM Incremental Dollars"),
                  ("$30M+ incremental dollars", "$8.7MM incremental dollars"),
                  ("$30M+ incremental revenue", "$8.7M incremental revenue"),
                  ("$30M+ impact on revenue", "$8.7M impact on revenue"),
              ],
              "work/case-studies/index.html": [
                  ("UHOne 2024 ($30M+ revenue, 1061% ROI)", "UHOne 2024 ($8.7M revenue, 1061% ROI)"),
              ],
          }
          for file_path, pairs in replacements.items():
              p = Path(file_path)
              text = p.read_text(encoding="utf-8")
              for old, new in pairs:
                  text = text.replace(old, new)
              p.write_text(text, encoding="utf-8")
          Path(".github/workflows/codex-update-cro-metrics.yml").unlink()
      - name: Verify correction
        shell: bash
        run: |
          set -euo pipefail
          grep -RIn --include='*.html' --include='*.js' '1030%\|data-to="1030"\|\$30M+' index.html src/index.js contact.html about.html services/index.html
          ! grep -n '\$30M+' work/case-studies/uhone-2024.html
          grep -n '\$8\.7M\|\$8\.7MM' index.html work/case-studies/uhone-2024.html work/case-studies/index.html
      - name: Commit correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "codex"
          git config user.email "codex@openai.com"
          git add index.html work/case-studies/uhone-2024.html work/case-studies/index.html .github/workflows/codex-update-cro-metrics.yml
          git commit -m "Keep UHOne-specific revenue figures unchanged"
          git push origin codex/update-cro-metrics
